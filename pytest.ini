[pytest]
# Enable asyncio tests
asyncio_mode = strict

# Add src to Python path for imports 
pythonpath = src

# Recursively discover tests in the tests directory
testpaths = tests

# File pattern for test discovery
python_files = test_*.py

# Show extra test summary info
addopts = -v -p no:pytest_ethereum

# Enable warnings about circular imports
filterwarnings =
    error::ImportWarning 