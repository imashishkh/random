apiVersion: 1

# Grafana datasources configuration for FX-Swarm
# This file is automatically loaded by Grafana when the container starts

datasources:
  # PostgreSQL datasource for the main forex database
  - name: FX-Swarm-Main-DB
    type: postgres
    url: postgres:5432
    database: forex
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_PASSWORD:-grafana_pass}
    jsonData:
      sslmode: "disable"
      maxOpenConns: 100
      maxIdleConns: 25
      connMaxLifetime: 14400
      postgresVersion: 1300
    editable: false
    
  # Postgres datasource for Airflow database (monitoring workflow status)
  - name: Airflow-DB
    type: postgres
    url: postgres:5432
    database: airflow
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_PASSWORD:-grafana_pass}
    jsonData:
      sslmode: "disable"
      maxOpenConns: 50
      maxIdleConns: 10
      connMaxLifetime: 14400
      postgresVersion: 1300
    editable: false 