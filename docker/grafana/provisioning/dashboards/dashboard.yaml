apiVersion: 1

# Grafana dashboard provider configuration
# This file tells Grafana where to find and how to load dashboards

providers:
  # Provider for FX-Swarm dashboards
  - name: 'FX-Swarm'
    orgId: 1
    folder: 'FX-Swarm'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
      
  # Provider for Airflow monitoring dashboards
  - name: 'Airflow'
    orgId: 1
    folder: 'Airflow'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/airflow
      foldersFromFilesStructure: true 